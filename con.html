<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CON – Study Resources</title>
  <link rel="stylesheet" href="style.css">

<body data-subject="con">

  <header>

    <h2 id="toc-heading" class="label">Doctrines</h2>
